plugins {
    id "java-library"
    // Forge 1.17–1.20.1 con los nombres de Mojang; el .jar sale reofuscado (SRG) para Forge.
    id "net.neoforged.moddev.legacyforge" version "2.0.148"
}

version = "1.0.0"
group = "mx.parabellum"
base { archivesName = "parabellum-forge-1.20.1" }

legacyForge {
    version = "1.20.1-47.4.26"
}

sourceSets.main.java.srcDir "../../nucleo/src/main/java"
sourceSets.main.java.srcDir "../../comun/mc-1.20.1"
sourceSets.main.resources.srcDir "../../comun/recursos"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") { expand "version": project.version }
}
