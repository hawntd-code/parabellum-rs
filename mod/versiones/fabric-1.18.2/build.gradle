plugins {
    id "fabric-loom" version "1.18.4"
}

version = "1.0.0"
group = "mx.parabellum"
base { archivesName = "parabellum-fabric-1.18.2" }

dependencies {
    // Con -Pmc=<versión> se comprueba que el mismo código sirva en las versiones vecinas.
    minecraft "com.mojang:minecraft:${project.findProperty('mc') ?: '1.18.2'}"
    mappings loom.officialMojangMappings()
    // Sin Fabric API: el mod funciona en cualquier instancia de Fabric (la tecla y los avisos van con mixins).
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
}

// El núcleo (puente, panel, avisos y capturas) es el mismo en todas las versiones.
sourceSets.main.java.srcDir "../../nucleo/src/main/java"
sourceSets.main.java.srcDir "../../comun/mc-1.18.2"
sourceSets.main.resources.srcDir "../../comun/recursos"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
