plugins {
    id "java-library"
    id "net.neoforged.moddev" version "2.0.148"
}

version = "1.0.0"
group = "mx.parabellum"
base { archivesName = "parabellum-neoforge-1.21.1" }

neoForge {
    version = "21.1.259"
}

// El núcleo y lo de Minecraft 1.21.1 son los mismos que en Fabric.
sourceSets.main.java.srcDir "../../nucleo/src/main/java"
sourceSets.main.java.srcDir "../../comun/mc-1.21.1"
sourceSets.main.resources.srcDir "../../comun/recursos"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") { expand "version": project.version }
}
