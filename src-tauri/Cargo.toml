[package]
name = "parabellum"
version = "0.36.0"
description = "Parabellum: launcher de Minecraft no premium"
edition = "2021"
publish = false

[[bin]]
name = "Parabellum"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# custom-protocol: la interfaz va dentro del .exe (sin servidor de desarrollo)
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "blocking"] }
futures = "0.3"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
# mods.toml de Forge y NeoForge (dependencias de cada mod)
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "2"
# Borrar a la papelera de reciclaje (se puede deshacer)
trash = "5"
base64 = "0.22"
# Ventana nativa de Windows para elegir archivos
tauri-plugin-dialog = "2"
sha2 = "0.10"
# Leer trozos de zips remotos (actualizar modpacks de Drive bajando solo lo que cambió)
flate2 = "1"
crc32fast = "1"
getrandom = "0.2"
# Conexión directa entre PCs (P2P): QUIC con perforación de NAT y relevo si no se puede directo
iroh = "1.3"

# Solo Windows (ver src/plataforma/windows): sesión cifrada con DPAPI, procesos atados a Parabellum
# (job), uso de memoria y procesador, avisos sin instalador, sonido, imágenes (WIC) y registro SRV.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_Globalization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_Media_Audio", "Win32_NetworkManagement_Dns"] }
# Arrastrar imágenes al chat desde el navegador y leer el portapapeles (OLE): plataforma/windows/arrastre.rs
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Foundation_Collections", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem", "Win32_Graphics_Imaging", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }
# La macro #[implement] (el receptor de arrastre) la pide aparte; la misma versión que ya usa Tauri (wry)
windows-core = "0.62"

# Solo macOS (ver src/plataforma/macos y docs/mac.md): la sesión cifrada con ChaCha20-Poly1305 y una
# clave guardada en el Llavero (ring ya viene con reqwest/rustls: no se compila nada nuevo), los
# avisos y las imágenes del chat.
[target.'cfg(target_os = "macos")'.dependencies]
ring = "0.17"

# Avisos con el Centro de Notificaciones (UserNotifications); objc2, su Foundation y block2 ya vienen con Tauri
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6"

# Leer a RGBA el PNG que da sips (imágenes del chat); la misma versión que ya usa Tauri
png = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
