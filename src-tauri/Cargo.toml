[package]
name = "parabellum"
version = "0.10.1"
description = "Parabellum: launcher de Minecraft no premium"
edition = "2021"
publish = false

[[bin]]
name = "Parabellum"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: la interfaz va dentro del .exe (sin servidor de desarrollo)
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "blocking"] }
futures = "0.3"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "2"
# Borrar a la papelera de reciclaje (se puede deshacer)
trash = "5"
base64 = "0.22"
# Ventana nativa de Windows para elegir archivos
tauri-plugin-dialog = "2"
sha2 = "0.10"
# Leer trozos de zips remotos (actualizar modpacks de Drive bajando solo lo que cambió)
flate2 = "1"
crc32fast = "1"
# Sesión de Google cifrada para el usuario de Windows (DPAPI), como la versión C#
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry"] }
# Avisos de Windows (notificaciones) sin instalador
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Foundation_Collections", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem"] }
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
